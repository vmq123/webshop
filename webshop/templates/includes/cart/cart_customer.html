{% from "webshop/templates/includes/cart/cart_macros.html" import show_address %}

<div class="mb-3 frappe-card p-5" data-section="shipping-address">
	<div class="d-flex">
		<div class="col-6 address-header"><h6>{{ _("Customer") }}</h6></div>
	</div>
	<div class="mb-3">
		<div class="row no-gutters">
			<input type="text" class="txtmobilenumber form-control mr-3 w-50 font-md" placeholder="Nhập số điện thoại" name="txtmobilenumber"  ></input>
			<button class="btn btn-primary btn-sm bt-search-customer font-md">{{ _("Search customer") }}</button>
		</div>
	</div>
	<div class="row no-gutters" data-fieldname="shipping_address_name">
		<div class="w-100 address-container" data-customer-name="{{customer.name}}" data-address-type="shipping" data-active>
			{% include "templates/includes/cart/customer_card.html" %}
		</div>
	</div>
</div>

<script>
frappe.ready(() => {
	$(".bt-search-customer").on("click", function() {
		// frappe.msgprint("Here")
		return frappe.call({
			type: "POST",
			method: "touropt.controllers.webshop_cart.search_and_update_customer_for_webshop_cart",
			args : {
				webshop_cart_id:frappe.get_cookie("webshop_cart_id"),
				phone_number : $('.txtmobilenumber').val()
			},
			callback: function(r) {
				if (r && r.message){
					if (r.message.result == 'Found') {
						$(".customer-name").text(r.message.customer_dn);
						$(".customer-mobile-no").text($('.txtmobilenumber').val());
						location.reload();
					} else {
						const d = new frappe.ui.Dialog({
							title: __('New Customer'),
							fields: [
								{
									label: __('Fullname'),
									fieldname: 'fullname',
									fieldtype: 'Data',
									reqd: 1
								},
								{
									label: __('Mobile number'),
									fieldname: 'mobile_number',
									fieldtype: 'Data',
									default: $('.txtmobilenumber').val(),
									reqd: 1
								},
							],
							primary_action_label: __('Save'),
							primary_action: (values) => {
								frappe.call({
									method: "touropt.controllers.webshop_cart.save_and_update_customer_for_webshop_cart",
									args: {
										webshop_cart_id:frappe.get_cookie("webshop_cart_id"),
										fullname: values.fullname,
										mobile_number: values.mobile_number
									},
									callback: function (r) {
										if (r.message.result == 'Success') {
											$(".customer-name").text(r.message.customer_dn);
											$(".customer-mobile-no").text($('.txtmobilenumber').val());
											d.hide();
											window.location.reload();
										} else {
											frappe.msgprint(__("Something went wrong, please try again later"))
										}
									}
								});

							}
						})
						d.show();
					}
				}
			}
		});
	});
});
</script>
